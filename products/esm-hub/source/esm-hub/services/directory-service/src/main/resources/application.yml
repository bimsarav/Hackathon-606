server:
  port: 8081
spring:
  application:
    name: directory-service
  datasource:
    url: ${ESM_DB_URL:jdbc:postgresql://localhost:5432/esm_directory}
    username: ${ESM_DB_USER:esm}
    password: ${ESM_DB_PASSWORD:esm}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    locations: classpath:db/common,classpath:db/migration
  kafka:
    bootstrap-servers: ${ESM_KAFKA:localhost:9092}
    producer:
      acks: all
      properties: { enable.idempotence: true }
esm:
  security:
    public-paths: [/api/v1/auth/login, /.well-known/jwks.json]
  jwt:
    issuer: ${ESM_JWT_ISSUER:esm-hub}
    ttl-minutes: ${ESM_JWT_TTL_MINUTES:60}
    private-key: ${ESM_JWT_PRIVATE_KEY:}
    public-key: ${ESM_JWT_PUBLIC_KEY:}
  auth:
    max-failed-logins: 5
    lock-minutes: 15
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging:
  structured.format.console: ${ESM_LOG_FORMAT:}
---
spring.config.activate.on-profile: demo
spring.flyway.locations: classpath:db/common,classpath:db/migration,classpath:db/seed

# Integration tests: Testcontainers provide DB and Kafka; tokens minted by TestJwt (TEST-ONLY key) are trusted.
spring.security.oauth2.resourceserver.jwt.public-key-location: classpath:test-jwt/public.pem
esm:
  outbox: { poll-ms: 200, initial-delay-ms: 200 }
  incident:
    jobs-enabled: false   # the ITs trigger the SLA scan and auto-close explicitly

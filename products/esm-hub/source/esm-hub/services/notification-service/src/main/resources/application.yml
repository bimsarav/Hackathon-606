server:
  port: 8087
spring:
  application:
    name: notification-service
  datasource:
    url: ${ESM_DB_URL:jdbc:postgresql://localhost:5432/esm_notification}
    username: ${ESM_DB_USER:esm}
    password: ${ESM_DB_PASSWORD:esm}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    locations: classpath:db/common,classpath:db/directory,classpath:db/migration
  kafka:
    bootstrap-servers: ${ESM_KAFKA:localhost:9092}
    producer:
      acks: all
      properties: { enable.idempotence: true }
  # Email: when spring.mail.host is unset a log sink (metadata only) marks emails SENT.
  mail:
    host: ${ESM_SMTP_HOST:}
    port: ${ESM_SMTP_PORT:25}
    username: ${ESM_SMTP_USER:}
    password: ${ESM_SMTP_PASSWORD:}
esm:
  notification:
    max-attempts: ${ESM_NOTIFICATION_MAX_ATTEMPTS:6}
    batch-size: 50
    poll-ms: 5000
    sender-enabled: true
    mail-from: ${ESM_MAIL_FROM:no-reply@esm-hub.local}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging:
  structured.format.console: ${ESM_LOG_FORMAT:}
---
spring.config.activate.on-profile: demo
spring.flyway.locations: classpath:db/common,classpath:db/directory,classpath:db/migration,classpath:db/seed

# Full stack: docker compose up -d --build   (first: scripts/init-settings.sh, then fill in settings.env), then open http://localhost:${WEB_PORT}
# Settings live in settings.env; Docker Compose reads them through the link .env -> settings.env.
# Start order: db (healthy) → migrate (done) and ingest (done) → api (healthy) → web. Every long-running service
# restarts unless stopped, so the stack comes back by itself after a server reboot (engineering standards §14).
name: disruption-advisor

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  WORKERS: ${API_WORKERS:-2}
  DATA_DIR: /data
  DEMO_USERS: ${DEMO_USERS:?set DEMO_USERS in settings.env}
  TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in settings.env}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  AGENT_EFFORT: ${AGENT_EFFORT:-medium}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
  AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
  DEFAULT_MCT_MINUTES: ${DEFAULT_MCT_MINUTES:-50}

services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

  migrate:
    build: ./backend
    image: disruption-advisor-api:latest
    command: ["alembic", "upgrade", "head"]
    healthcheck: { disable: true }  # one-shot job: the image's HTTP health check applies to the api only
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  # One-shot: airline extracts (read-only) → typed Parquet in the ops-data volume. Skips quickly when the inputs
  # are unchanged since the last run.
  ingest:
    image: disruption-advisor-api:latest
    command: ["python", "-m", "app.ingest"]
    healthcheck: { disable: true }
    environment:
      INPUT_DIR: /input
      DATA_DIR: /data
      INGEST_MEMORY_LIMIT: ${INGEST_MEMORY_LIMIT:-4GB}
      DEMO_SCENARIO: ${DEMO_SCENARIO:-false}
      OPERATING_CARRIERS: ${OPERATING_CARRIERS:-G9}
      DEFAULT_MCT_MINUTES: ${DEFAULT_MCT_MINUTES:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${INPUT_DIR:?set INPUT_DIR (folder with the airline extracts) in settings.env}:/input:ro
      - ops-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 8g
    logging: *logging

  # One-shot, after the ingest: the airline extracts (typed, bookings without names) into PostgreSQL schema
  # `extracts` for analysts and reports (app/ingest/to_postgres.py). Reloads only tables whose source changed. The
  # app does not depend on it, so the API starts without waiting for the bookings load (several minutes).
  extracts-db:
    image: disruption-advisor-api:latest
    command: ["python", "-m", "app.ingest.to_postgres"]
    healthcheck: { disable: true }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      DATA_DIR: /data
      EXTRACTS_TO_DB: ${EXTRACTS_TO_DB:-all}
      INGEST_MEMORY_LIMIT: ${INGEST_MEMORY_LIMIT:-4GB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ops-data:/data
    depends_on:
      ingest: { condition: service_completed_successfully }
    restart: "no"
    mem_limit: 6g
    logging: *logging

  api:
    image: disruption-advisor-api:latest
    environment: *api-env
    volumes:
      - ops-data:/data:ro
      - test-data:/testdata
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      ingest: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 3g
    logging: *logging

  web:
    build: ./frontend
    image: disruption-advisor-web:latest
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  db-data:
  ops-data:
  test-data:  # judge test data uploaded in the UI (separate from the real data)

# Serves the built SPA and proxies the API. TLS terminates at the outer reverse proxy / load balancer.
# Brute-force protection for sign-in: 10 attempts per minute per client address (burst 5).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Resolve the API through Docker's DNS on every request (cached 10 s) instead of once at start-up, so a recreated
    # api container (new IP) is found without restarting web. A variable in proxy_pass makes nginx resolve at run
    # time; without a URI part the request path is passed on unchanged, as before.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API and its interactive docs (the docs page loads Swagger UI from a CDN, so the SPA's CSP does not apply here).
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri /index.html;
    }
}

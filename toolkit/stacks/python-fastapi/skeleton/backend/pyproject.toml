[project]
name = "sample-app-api"
version = "0.1.0"
description = "Sample App API: FastAPI + SQLAlchemy + Alembic (generated from toolkit profile python-fastapi)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.165.0,<0.166",
    "uvicorn[standard]>=0.54.0,<0.55",
    "sqlalchemy>=2.1.9,<2.2",
    "alembic>=1.20.1,<1.21",
    "psycopg[binary]>=3.3.9,<3.4",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "structlog>=26.1.0,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "httpx2>=2.16.2,<3",
    "ruff==0.17.6",
    "mypy>=2.4.1,<3",
    "testcontainers[postgres]>=4.15.0,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "N", "SIM", "RUF", "C4", "PT", "ASYNC", "FAST"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import name refers to the Alembic library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing:skip-covered"
testpaths = ["tests"]

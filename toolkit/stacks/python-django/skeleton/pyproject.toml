[project]
name = "sample-app"
version = "0.1.0"
description = "Sample App: Django + DRF + htmx (generated from toolkit profile python-django)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.19,<5.3",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30.0,<0.31",
    "psycopg[binary]>=3.3.9,<3.4",
    "gunicorn>=27.0.1,<28",
    "whitenoise>=6.12.0,<7",
    "structlog>=26.1.0,<27",
    "django-environ>=0.14.0,<0.15",
    "django-stubs-ext>=5.2.9,<5.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-django>=4.14.0,<5",
    "pytest-cov>=7.1.0,<8",
    "ruff==0.17.6",
    "django-stubs[compatible-mypy]>=5.2.9,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "testcontainers[postgres]>=4.15.0,<5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "DJ", "N", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["apps/.*/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q --strict-markers --cov=apps --cov=config --cov-report=term-missing:skip-covered"
testpaths = ["apps"]
# STATIC_ROOT only exists inside the Docker image (collectstatic runs at build time).
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]

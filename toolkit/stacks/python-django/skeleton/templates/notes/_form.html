<form hx-post="{% url 'notes-create' %}" hx-target="#note-list" hx-swap="afterbegin"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  {% csrf_token %}
  <label for="id_title">Title</label>
  <input id="id_title" name="title" maxlength="200" required value="{{ form.title.value|default:'' }}"
         {% if form.title.errors %}aria-invalid="true" aria-describedby="title-errors"{% endif %}>
  {% if form.title.errors %}<p id="title-errors" class="error">{{ form.title.errors|join:" " }}</p>{% endif %}
  <label for="id_body">Body</label>
  <textarea id="id_body" name="body" rows="3">{{ form.body.value|default:'' }}</textarea>
  <button type="submit">Add note</button>
</form>

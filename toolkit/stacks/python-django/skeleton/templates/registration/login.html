{% extends "base.html" %}
{% block title %}Sign in · Sample App{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if form.errors %}<p class="error" role="alert">Your username and password didn't match.</p>{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <label for="id_username">Username</label>
  <input id="id_username" name="username" autocomplete="username" required>
  <label for="id_password">Password</label>
  <input id="id_password" type="password" name="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
